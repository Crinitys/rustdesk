name: Full Flutter CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (local testing only, not for upstream CI)"
        type: choice
        default: all
        options:
          - all
          - android
          - windows

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    permissions:
      contents: write
    with:
      upload-artifact: ${{ inputs.platform == 'android' }}
      platform: ${{ inputs.platform || 'all' }}
